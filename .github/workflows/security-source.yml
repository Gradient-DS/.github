name: Security Scanning (source)

on:
  workflow_call:
    inputs:
      python-paths:
        description: 'Space-separated dirs for Bandit. Empty disables the job.'
        type: string
        default: ''
      python-requirements:
        description: 'Space-separated requirements files for pip-audit. Ignored when python-uv is true.'
        type: string
        default: ''
      python-uv:
        description: 'Audit the uv lockfile via `uv export` instead of requirements files.'
        type: boolean
        default: false
      node-dirs:
        description: 'Space-separated dirs holding a package-lock.json. Empty disables the job.'
        type: string
        default: ''
      trivy-config-paths:
        description: 'Space-separated dirs for `trivy config` (IaC). Empty disables the job.'
        type: string
        default: ''
      exceptions-file:
        description: 'Path to the per-repo exception file, relative to the caller repo root.'
        type: string
        default: '.github/security-exceptions.yml'

env:
  TOOLING_PATH: .security-tooling

jobs:
  exceptions:
    name: Exception file valid and unexpired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Gradient-DS/.github
          ref: v1
          path: ${{ env.TOOLING_PATH }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Validate schema and fail on expired entries
        env:
          TOOLING_PATH: ${{ env.TOOLING_PATH }}
          EXCEPTIONS_FILE: ${{ inputs.exceptions-file }}
        run: |
          python "$TOOLING_PATH"/scripts/security_exceptions.py \
            --file "$EXCEPTIONS_FILE" --check-expiry

  sast-python:
    name: Python SAST (Bandit)
    if: inputs.python-paths != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install bandit
      - name: Run Bandit
        env:
          PYTHON_PATHS: ${{ inputs.python-paths }}
        run: |
          # shellcheck disable=SC2086
          bandit -r $PYTHON_PATHS -ll --confidence-level=medium \
            -x '*/node_modules/*,*/.venv/*,*/dist/*,*/.worktrees/*,*/.wt-*,*/tests/*'

  sca-python:
    name: Python Dependencies (pip-audit)
    if: inputs.python-requirements != '' || inputs.python-uv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check out shared tooling
        uses: actions/checkout@v6
        with:
          repository: Gradient-DS/.github
          ref: v1
          path: ${{ env.TOOLING_PATH }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install pip-audit pyyaml

      - name: Collect ignore arguments
        id: ignores
        env:
          TOOLING_PATH: ${{ env.TOOLING_PATH }}
          EXCEPTIONS_FILE: ${{ inputs.exceptions-file }}
        run: |
          ARGS=$(python "$TOOLING_PATH"/scripts/security_exceptions.py \
                   --file "$EXCEPTIONS_FILE" --emit-args)
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: inputs.python-uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Audit uv lockfile
        if: inputs.python-uv
        env:
          PIP_AUDIT_ARGS: ${{ steps.ignores.outputs.args }}
        run: |
          uv export --format requirements-txt --no-emit-project \
            --no-hashes --all-extras --no-dev > /tmp/uv-reqs.txt
          # shellcheck disable=SC2086
          pip-audit --desc on -r /tmp/uv-reqs.txt $PIP_AUDIT_ARGS

      - name: Audit requirements files
        if: '!inputs.python-uv'
        env:
          PYTHON_REQS: ${{ inputs.python-requirements }}
          PIP_AUDIT_ARGS: ${{ steps.ignores.outputs.args }}
        run: |
          # shellcheck disable=SC2086
          for f in $PYTHON_REQS; do
            echo "::group::pip-audit $f"
            pip-audit --desc on -r "$f" $PIP_AUDIT_ARGS
            echo "::endgroup::"
          done

  sca-node:
    name: Node Dependencies (npm audit)
    if: inputs.node-dirs != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Gradient-DS/.github
          ref: v1
          path: ${{ env.TOOLING_PATH }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Audit each Node directory
        env:
          # Values reach the shell through env, never interpolated into the
          # script text: a `${{ }}` substitution happens BEFORE the shell parses
          # the line, so metacharacters in a value would execute. NODE_DIRS is
          # expanded unquoted on purpose — word-splitting is wanted, command
          # substitution is not, and expansion results are never re-evaluated.
          NODE_DIRS: ${{ inputs.node-dirs }}
          EXCEPTIONS_FILE: ${{ inputs.exceptions-file }}
          TOOLING: ${{ env.TOOLING_PATH }}
        run: |
          for d in $NODE_DIRS; do
            echo "::group::npm audit $d"
            AUDIT_JSON="$(mktemp)"
            ( cd "$d" && npm ci --ignore-scripts ) || {
              echo "::error::npm ci failed in $d — cannot audit, failing closed"
              rm -f "$AUDIT_JSON"
              exit 1
            }
            ( cd "$d" && npm audit --json ) > "$AUDIT_JSON" || true
            python "$TOOLING/scripts/security_exceptions.py" \
              --file "$EXCEPTIONS_FILE" \
              --npm-audit-json "$AUDIT_JSON"
            rm -f "$AUDIT_JSON"
            echo "::endgroup::"
          done

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # gitleaks scans full history, not just the tip
      - name: Install gitleaks
        env:
          GITLEAKS_TAG: v8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_TAG}/gitleaks_${GITLEAKS_TAG#v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan history
        run: gitleaks git . --redact --exit-code 1 --verbose

  iac:
    name: IaC (trivy config)
    if: inputs.trivy-config-paths != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Gradient-DS/.github
          ref: v1
          path: ${{ env.TOOLING_PATH }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Generate .trivyignore from exceptions
        env:
          EXCEPTIONS_FILE: ${{ inputs.exceptions-file }}
          TOOLING: ${{ env.TOOLING_PATH }}
        run: |
          python "$TOOLING/scripts/security_exceptions.py" \
            --file "$EXCEPTIONS_FILE" \
            --emit-trivyignore .trivyignore
      - name: Run trivy config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '${{ inputs.trivy-config-paths }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: '.trivyignore'
