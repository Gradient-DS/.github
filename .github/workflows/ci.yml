name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --group dev

      - name: Install gitleaks
        # tests/test_gitleaks_scan_scope.py asserts the scan is scoped to the
        # ref under test by really running gitleaks; without the binary those
        # cases skip and the guard is worthless. Same pinned tag, and the same
        # checksum verification, as security-source.yml installs.
        env:
          GITLEAKS_TAG: v8.30.1
        run: |
          set -euo pipefail

          VERSION="${GITLEAKS_TAG#v}"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_TAG}"
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          WORK="$(mktemp -d)"

          curl -sSfL -o "$WORK/$TARBALL" "$BASE/$TARBALL"
          curl -sSfL -o "$WORK/checksums.txt" "$BASE/gitleaks_${VERSION}_checksums.txt"

          ( cd "$WORK" && grep " ${TARBALL}\$" checksums.txt | sha256sum -c - ) || {
            echo "::error::gitleaks ${GITLEAKS_TAG} checksum verification failed"
            exit 1
          }

          tar -xzf "$WORK/$TARBALL" -C /usr/local/bin gitleaks
          rm -rf "$WORK"
          gitleaks version

      - run: uv run pytest -v
