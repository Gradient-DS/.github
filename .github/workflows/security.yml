name: Security Scanning

# Shared security scans from Gradient-DS/security-ci. `gate` is the check the
# org rulesets require once this repo is tier production (security-ci
# governance/README.md); gitleaks always scans the full history.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  source:
    if: github.event.pull_request.draft != true
    uses: Gradient-DS/security-ci/.github/workflows/security-source.yml@71dea3696135309a19a1541157a249821bc08a2b # v16
    secrets: inherit
    permissions:
      contents: read

  # Org pre-commit hooks as the CI backstop.
  pre-commit:
    if: github.event.pull_request.draft != true
    uses: Gradient-DS/security-ci/.github/workflows/pre-commit.yml@71dea3696135309a19a1541157a249821bc08a2b # v16
    secrets: inherit

  gate:
    needs: [source, pre-commit]
    if: ${{ always() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every security job succeeded
        env:
          PRECOMMIT: ${{ needs.pre-commit.result }}
          SOURCE: ${{ needs.source.result }}
        run: |
          echo "source=$SOURCE  pre-commit=$PRECOMMIT"
          [ "$SOURCE" = "success" ] && [ "$PRECOMMIT" = "success" ]
